name: Dependency checksums (Linux dry run)
# Manual maintenance tool. Runs every task the CI workflow runs on a Linux runner with checksum writing switched on, so
# all dependencies are really resolved (Gradle's own --dry-run flag skips task execution and misses most of them). The
# entries Gradle adds go only into this throwaway checkout and are uploaded as an artifact: nothing is committed or
# trusted automatically. A person reviews the new entries (each must come from Google Maven, Maven Central or the
# Gradle Plugin Portal, the build's only repositories) and adds them by hand. Needed because the committed list was
# generated on Windows and lacks Linux-only artifacts (for example aapt2's Linux build).
on: workflow_dispatch
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      # Same tasks as the verify job; a failing task must not stop resolution of the others.
      - run: |
          gradle --write-verification-metadata sha256 --continue \
            :core:check :agent-sdk:check :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest \
            :agent-sdk-android:lintDebug :sample-agent:lintDebug :sample-agent:assembleDebug :app:lintRelease :app:assembleRelease || true
          cp gradle/verification-metadata.xml /tmp/linux-build.xml
      # The emulator job resolves more (the instrumented-test runner). This also runs the instrumented tests.
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          script: gradle --write-verification-metadata sha256 --continue connectedDebugAndroidTest || true
      - run: cp gradle/verification-metadata.xml /tmp/linux-device.xml
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verification-metadata-linux
          path: |
            /tmp/linux-build.xml
            /tmp/linux-device.xml
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
