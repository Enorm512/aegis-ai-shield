name: Android verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'
      # Actions are pinned to commit SHAs (resolved 2026-10-26 from the tags in the comments); re-resolve when updating.
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: python3 tools/check_privacy.py
      - run: bash core/run-tests.sh
      - run: java tools/IconPreview.java check app/src/main/res
      - run: |
          mkdir -p /tmp/core-classes /tmp/sdk-classes && javac -encoding UTF-8 --release 17 -d /tmp/core-classes core/src/main/java/com/aegis/core/*.java
          javac -encoding UTF-8 --release 17 -d /tmp/sdk-classes agent-sdk/src/main/java/com/aegis/agentsdk/*.java
          python3 tools/check_android_api.py /tmp/core-classes "$ANDROID_HOME/platforms/android-36/data/api-versions.xml" 26
          python3 tools/check_android_api.py /tmp/sdk-classes "$ANDROID_HOME/platforms/android-36/data/api-versions.xml" 26
      # Host tests of every pure-Java module (core and the agent SDK), then the Android modules: Aegis, the SDK client and the sample agent.
      - run: gradle :core:check :agent-sdk:check :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :agent-sdk-android:lintDebug :sample-agent:lintDebug :sample-agent:assembleDebug
      # Release gate: builds the unsigned release APK and refuses it if it trusts the published debug key, is not 16 KB aligned, or uses the debug package id.
      - run: gradle :app:lintRelease :app:assembleRelease
      - run: python3 tools/check_release_apk.py app/build/outputs/apk/release/app-release-unsigned.apk "$ANDROID_HOME/build-tools/36.0.0"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aegis-debug-and-reports
          path: |
            app/build/outputs/apk/
            app/build/reports/
            sample-agent/build/outputs/apk/
  device-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          script: gradle connectedDebugAndroidTest
